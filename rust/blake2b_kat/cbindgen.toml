# cbindgen configuration for the blake2b_kat crate.
# See 03-PHASE-2-C-FFI.md for a full explanation of each field.

# Generate a C header (not C++).
language = "C"

# Comment placed at the very top of the generated header.
header = "/* This file is generated by cbindgen. Do not edit by hand.\n * Regenerate with: cbindgen --config cbindgen.toml --crate blake2b_kat --output blake2b_kat_ffi.h\n */"

# C include guard macro name.
include_guard = "fox_blake2b_kat_ffi_h"

# Warning comment placed after the header comment.
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Do not edit manually. */"

[export]
# No prefix needed: opaque wrapper type is already named FoxBlake2bKat in Rust.
# Adding prefix = "Fox" here would produce FoxFoxBlake2bKat (double-prefix).

