# cbindgen configuration for chachapoly-vectors_base.
# See 03-PHASE-2-C-FFI.md for a full explanation of each field.

# Generate a C header (not C++).
language = "C"

# Comment placed at the very top of the generated header.
header = "/* This file is generated by cbindgen. Do not edit by hand.\n * Regenerate with: cbindgen --config cbindgen.toml --crate chachapoly-vectors_base --output chachapoly-vectors_base_ffi.h\n */"

# C include guard macro name.
include_guard = "fox_chachapoly_vectors_base_ffi_h"

# Warning comment placed after the header comment.
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Do not edit manually. */"

[export]
# No prefix needed: Rust types and functions already carry the Fox/fox_ prefix.
prefix = ""
